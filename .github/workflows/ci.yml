name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'website/**'
      - '*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'website/**'
      - '*.md'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        # Windows roughly doubles the wall clock, so it only guards master.
        os: ${{ github.ref == 'refs/heads/master' && fromJSON('[ "ubuntu-latest", "windows-latest" ]') || fromJSON('[ "ubuntu-latest" ]') }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      # When projects are created on Windows, the executable bit is sometimes lost. So set it back just in case.
      - name: Ensure Gradle is executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-agree: 'yes'
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run tests
        run: ./gradlew testAll ${{ github.ref == 'refs/heads/master' && '-Pkore.jsBrowserTests=true' || '' }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: |
            kore/build/reports/tests/
            oop/build/reports/tests/
            helpers/build/reports/tests/
            bindings/build/reports/tests/

name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'website/**'
      - '*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'website/**'
      - '*.md'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      # When projects are created on Windows, the executable bit is sometimes lost. So set it back just in case.
      - name: Ensure Gradle is executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-agree: 'yes'
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # `setup-gradle` only caches Gradle User Home, so without this the configuration cache is recalculated every run.
      # `build-logic`'s build dir rides along: its outputs are configuration inputs, and a missing one invalidates the entry.
      - name: Cache Gradle configuration cache
        uses: actions/cache@v6
        with:
          path: |
            .gradle/configuration-cache
            build-logic/convention/build
          key: gradle-config-cache-v2-${{ runner.os }}-${{ github.ref == 'refs/heads/master' && 'browser' || 'node' }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'build-logic/**/*.kt') }}

      - name: Run tests
        run: ./gradlew testAll ${{ github.ref == 'refs/heads/master' && '-Pkore.jsBrowserTests=true' || '' }}
        env:
          # npm's default cache sits on the runner's slow C: drive, a different volume than the D: workspace, so npm
          # copies every package instead of hardlinking it. Keeping both on one volume is worth ~2min on Windows.
          npm_config_cache: ${{ runner.temp }}/npm-cache

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: |
            kore/build/reports/tests/
            oop/build/reports/tests/
            helpers/build/reports/tests/
            bindings/build/reports/tests/

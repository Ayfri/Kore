name: Publish Snapshot

on:
  push:
    branches:
      - master
    # No website or docs content ships in the artifacts.
    paths-ignore:
      - 'website/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: snapshot-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-upload
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # `setup-gradle` only caches Gradle User Home. `build-logic`'s build dir rides along as a configuration input.
      - name: Cache Gradle configuration cache
        uses: actions/cache@v6
        with:
          path: |
            .gradle/configuration-cache
            build-logic/convention/build
          key: gradle-config-cache-publish-v1-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'build-logic/**/*.kt') }}

      - name: Publish snapshot to Central Portal
        run: ./gradlew publishToMavenCentral -Pkore.publish.snapshot=true --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}

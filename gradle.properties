kotlin.code.style=official

# K2 rebuilds the whole module when any common source is dirty (KT-62686). This restores regular IC, at the cost of
# common code sometimes resolving against platform declarations: `clean` fixes a compile error that makes no sense.
# On JS it is only correct with `-Xklib-ir-inliner=disabled`, set in `kotlin-conventions`.
kotlin.internal.incremental.enableUnsafeOptimizationsForMultiplatform=true

# npm drives the Kotlin/JS toolchain; the Yarn integration is on its way out of the Kotlin Gradle plugin (KT-84662).
kotlin.js.yarn=false

# Minecraft version
minecraft.version=26.3

# Gradle optimization flags
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.tooling.parallel=true
# Forced rather than left on auto: auto probes every mounted drive at each build start to find the unwatchable ones,
# which stalls 11-20 s on Windows whenever a mapped network drive is unreachable.
org.gradle.vfs.watch=true
